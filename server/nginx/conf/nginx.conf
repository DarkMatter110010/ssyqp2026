
#user  nobody;
worker_processes  1;

error_log  logs/error.log;
pid        logs/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # HTTP(80) 自动跳转到 HTTPS(443)。本机 80 端口被系统保留时请删除此块。
    #server {
    #    listen       80;
    #    server_name  localhost 127.100.10.1;
    #
    #    location / {
    #        return 301 https://$host$request_uri;
    #    }
    #}

    # HTTPS 主服务：反向代理到 Flask(https://127.0.0.1:5050)
    server {
        listen       7443 ssl;
        server_name  127.100.10.1;

        ssl_certificate      ../../ssl/cert.pem;
        ssl_certificate_key  ../../ssl/key.pem;

        ssl_session_cache    shared:SSL:1m;
        ssl_session_timeout  5m;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers  on;

        location / {
            proxy_pass         https://127.100.10.1:5050;
            proxy_ssl_verify   off;  # 后端为自签名证书，跳过校验
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
    }
}
